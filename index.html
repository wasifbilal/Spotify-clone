<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="navbar">
        <nav>
            <ul>
                <li class = brand><img src="logo.webp" alt="Spotify" style="height: 50px; width: 50px; border-radius: 1rem;">
                    <b style="font-size: large;">Spotify</b> </li>
                <li>Home</li>
                <li>About us</li>
            </ul>
        </nav>
    </div>

    <div class="container">
        <div id="songList">
            <h2 style="color: white;">Best of NCS - no copyright sound</h2>        
            <div class="songItemContainer">
                <div class="songItem">
                    <img src="cover.webp" alt="image cover">
                    <span class="songName">Let me love you</span>
                    <span class="song_list_Play"><span id="songStamp">05:34<i id = "1" class="fa-solid songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.webp" alt="image cover">
                    <span class="songName">Let me love you</span>
                    <span class="song_list_Play"><span id="songStamp">05:34<i id = "2" class="fa-solid songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.webp" alt="image cover">
                    <span class="songName">Let me love you</span>
                    <span class="song_list_Play"><span id="songStamp">05:34<i id = "3" class="fa-solid songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.webp" alt="image cover">
                    <span class="songName">Let me love you</span>
                    <span class="song_list_Play"><span id="songStamp">05:34<i id = "4" class="fa-solid songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.webp" alt="image cover">
                    <span class="songName">Let me love you</span>
                    <span class="song_list_Play"><span id="songStamp">05:34<i id = "5" class="fa-solid songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.webp" alt="image cover">
                    <span class="songName">Let me love you</span>
                    <span class="song_list_Play"><span id="songStamp">05:34<i id = "6" class="fa-solid songItemPlay fa-circle-play"></i></span></span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="progressBar" min="0" max="100" value="0">
        <div id="icons">
            <!-- fontAwesome icons -->
            <i id="previous" class="fa-solid fa-2x fa-backward"></i>
            <i class="fa-solid fa-2x fa-circle-play" id="masterPlay"></i>
            <i id="next" class="fa-solid fa-2x fa-forward"></i>
        </div>
        <div class="songInfo">
            <img src="spotify gif.gif" alt="music gif" width="40px" height="20rem" id="gif">
            <span id="masterSongName">Dil awara</span>
        </div>
    </div>
    <script src="script.js"> </script>
</body>
</html>
